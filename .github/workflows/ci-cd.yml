name: ci-cd
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Java
        uses: actions/setup-java@main
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build and Test
        run: |
            chmod 777 gradlew
            ./gradlew clean build test
      - name: Login to Docker
        run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}
      - name: Build Docker
        run: docker build -t estohlmann/tic-tack-toe .
      - name: Push Docker Image
        run: docker push estohlmann/tic-tack-toe:latest